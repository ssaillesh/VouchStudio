<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>VouchStudio: create your account</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/studio.css?v=brand-1">
  <script src="/static/site.js?v=brand-1" defer></script>
</head>
<body class="site" data-page="auth">
  <header class="topbar site-bar">
    <a class="brand" href="/" aria-label="VouchStudio home"><svg class="mark" viewBox="2 12 60 43" aria-hidden="true" focusable="false"><path d="M2 12H20L31 34L34.2 29.6L42.2 40.2L35.4 51.6C33.4 55.2 28.6 55.2 26.6 51.6Z"/><path d="M36.6 26.4L46.4 12H62L44.6 37.4Z"/></svg><span class="wordmark">VouchStudio</span></a>
    <span class="tagline bar-tagline">Better jobs. Smarter search.</span>
  </header>

  <main class="auth-main">
    <section class="auth-card reveal" aria-labelledby="auth-title">
      <svg class="mark auth-mark" viewBox="2 12 60 43" aria-hidden="true" focusable="false"><path d="M2 12H20L31 34L34.2 29.6L42.2 40.2L35.4 51.6C33.4 55.2 28.6 55.2 26.6 51.6Z"/><path d="M36.6 26.4L46.4 12H62L44.6 37.4Z"/></svg>
      <p class="eyebrow" id="auth-eyebrow">Create your account</p>
      <h1 id="auth-title">Start with your resume.</h1>
      <p class="lede" id="auth-lede">Make an account, upload your resume or master profile, and every
        job on the board is scored for you.</p>

      <form id="auth-form" novalidate>
        <label class="field" id="name-field"><span>Name <span class="faint">(optional)</span></span>
          <input type="text" id="auth-name" name="name" autocomplete="name" maxlength="80">
        </label>
        <label class="field">Email
          <input type="email" id="auth-email" name="email" autocomplete="email" required maxlength="254">
        </label>
        <label class="field">Password
          <input type="password" id="auth-password" name="password" autocomplete="new-password"
            required minlength="8" maxlength="256">
          <span class="hint" id="password-hint">At least 8 characters.</span>
        </label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn primary large block" type="submit" id="auth-submit">Create account</button>
      </form>

      <p class="auth-switch" id="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </section>
  </main>
</body>
</html>
